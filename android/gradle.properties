# Экономия памяти: 1.5 ГБ кучи, минимальные метапространство и код-кэш
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError

# Экономия памяти: кэширование включено, параллелизм выключен
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# Ограничение потоков Gradle daemon
org.gradle.workers.max=2

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
